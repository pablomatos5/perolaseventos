# Pérolas Eventos (perolaseventos.store) — FASE 2, com HTTPS. Ver perolaseventos.store.conf (fase 1).
# Certificado em /opt/sites-extra/perolas/certs (renovação própria no crontab do root).

server {
    listen 80;
    server_name perolaseventos.store www.perolaseventos.store;

    location /.well-known/acme-challenge/ {
        root /etc/nginx/sites-extra/perolas/acme;
    }

    location / {
        return 301 https://perolaseventos.store$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.perolaseventos.store;

    ssl_certificate     /etc/nginx/sites-extra/perolas/certs/live/perolaseventos.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/sites-extra/perolas/certs/live/perolaseventos.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://perolaseventos.store$request_uri;
    }
}

# Microcache (só deste site): aguenta pico de acessos (lançamento de lote). A página inicial pronta é
# reaproveitada por 10 s; arquivos do site (_next/static, imagens, vídeos) por 1 dia. Reserva, pagamento,
# pedido, painel e portaria NUNCA passam pelo cache (estoque e preço são conferidos na hora da reserva).
proxy_cache_path /var/cache/nginx/perolas levels=1:2 keys_zone=perolas:20m max_size=500m inactive=2d use_temp_path=off;

server {
    listen 443 ssl;
    http2 on;
    server_name perolaseventos.store;

    ssl_certificate     /etc/nginx/sites-extra/perolas/certs/live/perolaseventos.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/sites-extra/perolas/certs/live/perolaseventos.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # página inicial: GET sem cookie do painel e sem ação de formulário (POST nunca é cacheado)
    location = / {
        set $perolas_app http://perolas-app:3000;
        proxy_pass $perolas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        set $perolas_skip 0;
        if ($http_cookie ~* "pe_admin") { set $perolas_skip 1; }
        if ($http_next_action) { set $perolas_skip 1; }
        proxy_cache perolas;
        proxy_cache_key "$scheme$host$request_uri$http_rsc$http_next_router_state_tree";
        proxy_cache_valid 200 10s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_bypass $perolas_skip;
        proxy_no_cache $perolas_skip;
        proxy_ignore_headers Cache-Control Set-Cookie Expires;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status always;
    }

    # arquivos do site (nomes com hash ou mídia estática)
    location ~ ^/(_next/static/|2027/|atracoes/|edicoes/|patrocinadores/|_next/image) {
        set $perolas_app http://perolas-app:3000;
        proxy_pass $perolas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_cache perolas;
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Set-Cookie Expires;
        add_header X-Cache $upstream_cache_status always;
    }

    location / {
        set $perolas_app http://perolas-app:3000;
        proxy_pass $perolas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
