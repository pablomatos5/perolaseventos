# Pérolas Eventos (perolaseventos.store): projeto independente que só divide esta VPS e o nginx de entrada.
# App em /opt/perolaseventos (container perolas-app), alcançado pela rede própria "perolas_edge"
# (isolada dos outros projetos). Certificado e desafio ACME em pastas próprias:
#   /opt/sites-extra/perolas/certs  e  /opt/sites-extra/perolas/acme
# Mudança aqui: docker exec nexos-nginx-1 nginx -t && docker exec nexos-nginx-1 nginx -s reload (nunca restart).
#
# FASE 1 (este arquivo): só HTTP, até o domínio apontar para a VPS e o certificado ser emitido.
# FASE 2: trocar pelo perolaseventos.store.https.conf.

server {
    listen 80;
    server_name perolaseventos.store www.perolaseventos.store;

    location /.well-known/acme-challenge/ {
        root /etc/nginx/sites-extra/perolas/acme;
    }

    client_max_body_size 2m;

    location / {
        # variável + resolver (nginx.conf principal): recriar o container não prende o nginx ao IP
        # antigo, e o nginx sobe mesmo com o app fora do ar
        set $perolas_app http://perolas-app:3000;
        proxy_pass $perolas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # sobrescreve, nunca anexa: o cliente não planta IP falso no limite de tentativas
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
