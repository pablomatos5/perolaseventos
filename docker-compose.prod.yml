# Produção na VPS compartilhada com outros projetos (Nexos, jessassinaturas), ISOLADA deles:
# - rede própria "perolas_edge" só com o app e o nginx de entrada (o nginx do Nexos é o único dono das
#   portas 80/443): o Pérolas não enxerga os bancos/containers dos outros e vice-versa;
# - banco numa rede interna exclusiva, sem porta publicada; volume, .env e limites de memória próprios.
# Uma vez por VPS:  docker network create perolas_edge && docker network connect perolas_edge nexos-nginx-1
# (se o nginx do Nexos for recriado, repetir o "connect"; o vhost usa resolver e não derruba o nginx).
# Vhost: /opt/sites-extra/conf/perolaseventos.store.conf (mudança: nginx -t + reload, nunca restart).
#
# .env da VPS (não versionado): POSTGRES_PASSWORD forte e
#   DATABASE_URL="postgresql://perolas:SENHA@db:5432/perolas?schema=public"
# mais TICKET_SECRET, ADMIN_PASSWORD, APP_URL, PAYMENT_PROVIDER... (ver .env.example e npm run check:config).
networks:
  default:
    internal: true # banco e app conversam aqui; sem saída para fora
  edge:
    name: perolas_edge
    external: true

services:
  db:
    image: postgres:17-alpine
    container_name: perolas-db
    restart: unless-stopped
    networks: [default]
    environment:
      POSTGRES_USER: perolas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: perolas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perolas -d perolas"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    # Sem "ports": o banco não fica exposto fora da rede do compose.

  migrate:
    build: { context: ., target: deps }
    env_file: .env
    command: npx prisma migrate deploy
    networks: [default]
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]

  seed:
    build: { context: ., target: deps }
    env_file: .env
    command: npx tsx prisma/seed.ts
    networks: [default]
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]

  app:
    # NEXT_PUBLIC_* vão no build (ficam gravadas no JS do site); o compose lê o valor do .env desta pasta
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: perolas-app
    restart: unless-stopped
    env_file: .env
    networks: [default, edge]
    depends_on: { db: { condition: service_healthy } }
    mem_limit: 768m

volumes:
  pgdata:
